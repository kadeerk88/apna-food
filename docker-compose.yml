version: '3.9'

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: alipur_food_api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://alipur_admin:SecurePass2026@postgres:5432/alipur_food_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - JWT_SECRET_KEY=supersecretjwtkey_alipur_punjab_pk_2026
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: alipur_postgres
    environment:
      - POSTGRES_USER=alipur_admin
      - POSTGRES_PASSWORD=SecurePass2026
      - POSTGRES_DB=alipur_food_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: alipur_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  pgdata:
